services:
  # Backend 25-Pillar AI Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: aetherstore-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./data/aetherstore.db
      - DEBUG=False
      - ENVIRONMENT=production
    volumes:
      # Persistent storage for DB, large AI models, and uploads
      - backend-ai-models:/app/ai_models
      - backend-uploads:/app/uploads
      - backend-data:/app/data
      - backend-temp:/app/temp
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend Immersive UI
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: aetherstore-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  backend-ai-models:
  backend-uploads:
  backend-data:
  backend-temp:
