<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Babylon.js Core Verification</title>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
    <script src="https://cdn.babylonjs.com/havok/HavokPhysics_umd.js"></script>
    <script src="js/instancing-system.js"></script>
    <script src="js/auto-lod-system.js"></script>
    <script src="js/device-profiler.js"></script>
    <script src="js/babylon-core.js"></script>
    <script src="js/webrtc-manager.js"></script>
    <script src="js/social-manager.js"></script>
    <style>
        canvas { width: 100%; height: 500px; touch-action: none; }
        .controls { margin: 20px; }
    </style>
</head>
<body>
    <h1>Babylon.js Core Verification</h1>
    <div class="controls">
        <button onclick="changeLighting('studio')">Studio</button>
        <button onclick="changeLighting('cinematic')">Cinematic</button>
        <button onclick="changeLighting('sunlight')">Sunlight</button>
        <button onclick="changeLighting('neon')">Neon</button>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            window.userId = 'test-user';
            const engine = new AetherBabylon('renderCanvas');

            // Wait for WebGPU/WebGL engine to fully initialize before creating meshes
            await engine.ready;

            window.engineInstance = engine;

            // Initialize Social Manager with WebRTC
            window.socialManager = new SocialManager('test-room-1', window.userId, engine);

            // Mock remote avatar
            engine.updateRemoteAvatar('remote-1', {
                position: {x: 2, y: 0, z: 0},
                rotation: {x: 0, y: Math.PI, z: 0},
                animation_state: 'walk'
            });

            // Add a local sphere to verify rendering
            const sphere = BABYLON.MeshBuilder.CreateSphere("sphere", {diameter: 1}, engine.scene);
            sphere.position.y = 1;
            const mat = new BABYLON.StandardMaterial("sphereMat", engine.scene);
            mat.diffuseColor = new BABYLON.Color3(1, 0, 0);
            sphere.material = mat;
        });

        function changeLighting(preset) {
            window.engineInstance.applyLightingPreset(preset);
        }
    </script>
    <!-- Service Worker Registration for 3D Asset Caching -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
